<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 42">
  <!-- Baccard Rooms mark: TWO CARDS DEALT. An oxblood card turned 10° behind
       an ivory one, both edged in brass, with a spade printed on the face of
       the front card. The same drawing as src/components/Logo.tsx, re-laid
       onto the 42x42 plate every icon in this network uses.

       The first <rect fill> is what app/apple-icon.tsx reads as the 180x180
       background plate — the FELT, so iOS composites the cards onto the
       table rather than onto black.

       THE PIP IS A PATH, NOT A <text> GLYPH. The mockup draws it (and a "9")
       with font-family="Georgia,serif", which a browser rasterising a favicon
       on Linux or Android has no font for, and which Satori cannot draw at
       all without a font binary. The "9" is dropped outright: at 16px an
       11px numeral beside the pip is two marks inside 30 pixels and the
       numeral goes to mud first.

       src/app/favicon.ico is the same artwork rasterised at 16/32/48 — see
       scripts/make-favicon.py, where the spade is built from a wedge, two
       lobes and a stem because that file has no path parser. Same silhouette,
       same bounds. -->
  <rect width="42" height="42" rx="10" fill="#0e3a2d"/>
  <rect x="12" y="5.5" width="20" height="28" rx="3.2" fill="#8e1b2b" stroke="#c9a45c" stroke-width="1.4" transform="rotate(10 21 21)"/>
  <rect x="7.7" y="8.7" width="20" height="28" rx="3.2" fill="#f6f0e1" stroke="#c9a45c" stroke-width="1.4"/>
  <g transform="translate(3.7 4) scale(0.7)">
    <path d="M20 17c0 0 8 6 8 10.5 0 3-2.2 5-4.6 5-1.6 0-2.8-.8-3.4-1.8-.6 1-1.8 1.8-3.4 1.8-2.4 0-4.6-2-4.6-5C12 23 20 17 20 17Z
             M17.4 37c1.4-1.5 2-3.1 2.2-5h.8c.2 1.9.8 3.5 2.2 5Z" fill="#1b1712"/>
  </g>
</svg>
